experiments:
  - name: "embedding_experiment"
    config_type: embedding
    type: simple
    model: all-MiniLM-L6-v2
    top_k: 5
    chunk_size: 200
    chunk_overlap: 50
    evaluate_metrics: true
    model_name: "all-MiniLM-L6-v2"
    embedding_weight: 0.7
    tfidf_weight: 0.3

  - name: "rada_experiment"
    config_type: rada
    type: simple
    model: all-MiniLM-L6-v2
    top_k: 5
    chunk_size: 200
    chunk_overlap: 50
    evaluate_metrics: true
    model_name: "all-MiniLM-L6-v2"
    embedding_weight: 0.7
    tfidf_weight: 0.3