[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag_testing"
version = "0.1.0"
description = "A framework for testing RAG systems with token-based chunking"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "langchain>=0.0.300",
    "pytest>=7.0.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.5.0",
    "mlflow>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["rag_testing"] 